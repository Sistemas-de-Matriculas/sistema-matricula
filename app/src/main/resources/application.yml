spring:
  application:
    name: sistema-matricula
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:matricula}
    username: ${DB_USER:matricula}
    password: ${DB_PASSWORD:matricula}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    locations: classpath:db/migration

logging:
  level:
    root: INFO

bootstrap:
  admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:secretaria}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:secretaria}
